name: Update TJR Report

# ============================================================================
# TAKTUNG - warum dieser Workflow eine Schleife enthaelt
# ============================================================================
# Gemessen am 2026-09-10 ueber 2,5 Tage: GitHub startete den Lauf im MEDIAN nur
# alle 92 Minuten, die groesste Luecke betrug 11,6 Stunden - obwohl unten
# Cron-Eintraege mit 15 Minuten stehen. Das ist GitHubs bekannte Drosselung
# haeufiger Zeitplaene; im Repo laesst sie sich nicht abstellen.
#
# Folge: Setups, die innerhalb einer Stunde entstehen und wieder vergehen,
# wurden nie gesehen. Zusammen mit dem engen Handelsfenster (9-10/15-17 Wien)
# war das der zweite Grund fuer die wenigen Trades.
#
# Loesung ohne Token und ohne fremden Dienst: Der Lauf startet seltener, bleibt
# dafuer rund eine Stunde am Leben und arbeitet SELBST im 5-Minuten-Takt. Aus
# einem Start werden so zehn Auswertungen. Moeglich, weil das Repo oeffentlich
# ist - dort sind Actions-Minuten unbegrenzt und kostenlos.
# ============================================================================

on:
  schedule:
    # Dank "concurrency" unten laeuft trotzdem immer nur EIN Lauf, und ein
    # wartender startet sofort, wenn der vorige endet. Damit heilt der
    # Zeitplan GitHubs Aussetzer selbst.
    #
    # ------------------------------------------------------------------
    # GEMESSEN 06.11.2026, vier Wochen Commit-Zeiten, nur Werktage:
    #   11-21 UTC  dicht belegt (62 bis 171 Laeufe je Stunde)
    #   03-05 UTC  NULL Laeufe
    #   08-09 UTC  NULL Laeufe
    #   06/07/10   zusammen 11 Laeufe, also praktisch ein einziger Start
    #
    # Wien liegt im Winter bei UTC+1. 08-09 UTC ist damit exakt Tiams
    # Vormittagsfenster 9-10 Uhr - das war VIER WOCHEN LANG dunkel. Jeder
    # Trade im Log stammt aus dem Nachmittagsfenster, nicht weil vormittags
    # nichts passiert, sondern weil niemand hingeschaut hat.
    #
    # Zwei Ursachen, beide hier behoben:
    #   1. Zwischen 22 und 06 UTC stand ueberhaupt kein Cron. Die Kette
    #      endete also jede Nacht gegen 02:30 und niemand weckte sie.
    #   2. Die Eintraege um 06-08 UTC laesst GitHub fast immer fallen
    #      (bekannte Drosselung, im Repo nicht abstellbar).
    #
    # Gegenmittel: ein Eintrag ueber ALLE Stunden, damit nie eine Luecke im
    # Zeitplan selbst entsteht, UND unten eine deutlich laengere Schleife.
    # Ein Lauf lebt jetzt rund fuenf Stunden statt 50 Minuten - es muss also
    # nur noch EINER von rund fuenfzehn Zeitplan-Starts je Nacht
    # durchkommen, damit der Vormittag abgedeckt ist.
    #
    # Weiterhin bewusst nur Mo-Fr: am Wochenende soll sich nichts aendern.
    # ------------------------------------------------------------------
    - cron: "*/20 * * * 1-5"
  # Bewusst mit paths-Filter: ein Push, der nur docs/ oder signals_log.json
  # aendert, ist ja gerade das ERGEBNIS eines Laufs und wuerde sonst sofort
  # den naechsten ausloesen (Endlosschleife).
  push:
    branches: [main]
    paths:
      - "engine.js"
      - "build.js"
      - "tjr_rules.js"
      - "auto_tune.js"
      - "kerzen_archiv.js"
      # Vorlagen und gemeinsames Stylesheet (22.10.2026): eine
      # Design-Aenderung soll die Seite sofort neu bauen, nicht erst
      # beim naechsten Zeitplan-Lauf. Reine Anzeige, keine Handelslogik.
      - "docs/report_template.html"
      - "docs/history_template.html"
      - "docs/stil.css"
      - ".github/workflows/update.yml"
  workflow_dispatch: {}

permissions:
  contents: write

# Nur EIN Lauf gleichzeitig. Zwei Gruende:
#  1. Zwei gleichzeitig schreibende Laeufe kaemen sich beim Push ins Gehege
#     und koennten signals_log.json beschaedigen.
#  2. GitHub haelt je Gruppe hoechstens einen WARTENDEN Lauf vor. Sobald die
#     Schleife endet, startet er sofort - nahezu luckenlose Abdeckung.
# cancel-in-progress bewusst FALSE: ein laufender Durchgang darf nie
# abgeschnitten werden, sonst bliebe ein halb geschriebenes Log zurueck.
concurrency:
  group: tjr-report
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Schleife ~5 Stunden + Puffer. GitHub erlaubt bis zu 6 Stunden je Job.
    # Gemessen: 10 Durchlaeufe brauchten 47 Minuten, davon 45 Minuten Schlaf -
    # der Bau selbst kostet rund 16 Sekunden. 58 Durchlaeufe sind damit
    # 285 Minuten Schlaf plus gut 15 Minuten Arbeit, also etwa 5 Stunden.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Report erzeugen (Schleife, alle 5 Minuten)
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          # KEIN "set -e": ein einzelner misslungener Durchlauf (z.B. Yahoo
          # antwortet kurz nicht) darf die restlichen neun nicht mitreissen.
          set +e
          # 06.11.2026 von 10 auf 58 erhoeht - siehe die Messung oben beim
          # Zeitplan. Nicht, um oefter zu rechnen (der Takt bleibt 5 Minuten),
          # sondern damit ein Lauf die Nacht ueberbrueckt und der Vormittag
          # nicht mehr davon abhaengt, ob GitHub den 08-UTC-Start zulaesst.
          DURCHLAEUFE=58
          git config user.name "tjr-bot"
          git config user.email "actions@github.com"

          for i in $(seq 1 $DURCHLAEUFE); do
            echo "::group::Durchlauf $i von $DURCHLAEUFE"

            node build.js

            # tuning.json MUSS mit committet werden: die Selbstjustierung
            # schreibt ihren Stand dorthin. Fehlte es hier, waere jede
            # Anpassung beim naechsten Lauf spurlos weg (gefunden 2026-09-05).
            # ACHTUNG: feste Liste. Eine neu erzeugte Seite, die hier fehlt,
            # wird bei jedem Lauf gebaut und nie committet - genau so ging im
            # September tuning.json wochenlang verloren. Beim Hinzufuegen einer
            # Ausgabedatei IMMER auch diese Zeile ergaenzen.
            git add docs/index.html docs/chart.html docs/history.html docs/tjr_methode.html state.json signals_log.json session_log.json tuning.json
            # daten/ = selbst aufgebaute 5min-Kurshistorie (kerzen_archiv.js).
            # Als if-Block, weil der Ordner beim allerersten Lauf fehlt.
            if [ -d daten ]; then git add daten; fi

            if git diff --quiet --cached; then
              echo "Nichts geaendert - kein Commit."
            else
              git commit -m "Report aktualisiert: $(date -u +'%Y-%m-%d %H:%M UTC')"
              # Defensiv: falls doch jemand dazwischen gepusht hat.
              git pull --rebase --autostash -q
              if git push -q; then
                echo "Gepusht."
              else
                echo "Push fehlgeschlagen - naechster Durchlauf versucht es erneut."
              fi
            fi

            echo "::endgroup::"
            if [ "$i" -lt "$DURCHLAEUFE" ]; then sleep 300; fi
          done

          echo "Schleife beendet. Ein wartender Lauf uebernimmt jetzt."
