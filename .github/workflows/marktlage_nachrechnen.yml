name: Marktlage nachrechnen

# ============================================================================
# EINMALIGER RUECKWAERTSLAUF - kein Zeitplan, nur von Hand.
# ============================================================================
# Rechnet das Umfeld fuer vergangene Handelstage nach, damit die bereits
# abgeschlossenen Trades nach Umfeld auswertbar werden. Streng ohne Blick in
# die Zukunft (siehe marktlage_historie.js).
#
# Eigene concurrency-Gruppe, damit dieser Lauf weder den TJR-Report noch den
# taeglichen Marktlage-Lauf blockiert. Er schreibt genau eine Datei:
# daten/marktlage/historie.json - und ueberschreibt darin keine bestehende
# Zeile.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      ab:
        description: "Fruehestes Datum (YYYY-MM-DD), leer = so weit wie moeglich"
        required: false
        default: ""

concurrency:
  group: marktlage-nachrechnen
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  nachrechnen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Umfeld rueckwaerts rechnen
        run: node marktlage_nachrechnen.js ${{ github.event.inputs.ab }}

      - name: Ergebnis sichern
        run: |
          git config user.name "tjr-bot"
          git config user.email "actions@github.com"
          git add daten/marktlage/historie.json
          if git diff --quiet --cached; then
            echo "Nichts geaendert - kein Commit."
          else
            git commit -m "Marktlage: Umfeld rueckwirkend nachgerechnet"
            for i in 1 2 3; do
              git pull --rebase --autostash -q || true
              if git push -q; then echo "Gepusht."; break; fi
              sleep 5
            done
          fi
